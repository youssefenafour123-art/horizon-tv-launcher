<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../shared/base.css">
<style>
:root {
  --ink: #ffffff;
  --ink-2: rgba(255,255,255,.76);
  --ink-3: rgba(255,255,255,.52);
  --hair: rgba(255,255,255,.16);
  --accent: #ffd67e;
  --f-display: system-ui, sans-serif;
  --f-text: system-ui, sans-serif;
  --f-ar: sans-serif;
  --clock-size: 236px;
  --clock-weight: 200;
  --clock-track: -.05em;
  --dim: 0;
  --ease: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.34,1.36,.64,1);
}
body { font-family: var(--f-text); color: var(--ink); }
#stage { background: #0a0d1a; }
.ar { font-family: var(--f-ar); direction: rtl; }
.display { font-family: var(--f-display); }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- wallpaper, parallax, dim, legibility ---------- */
.wall { transform: translate3d(var(--px, 0px), 0, 0) scale(1.035); transition: transform 1.8s var(--ease); will-change: transform; }
body.no-parallax .wall { transform: none; }
.dim { position: absolute; inset: 0; background: #05070f; opacity: var(--dim); transition: opacity .6s var(--ease); pointer-events: none; }
body.scrim-baked .scrim { display: none; } /* painted into the landscape canvas instead: one less full-screen layer */
.scrim { position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(4,6,14,.46) 0%, rgba(4,6,14,0) 24%),
    linear-gradient(0deg, rgba(4,6,14,.86) 0%, rgba(4,6,14,.55) 26%, rgba(4,6,14,0) 52%),
    radial-gradient(55% 48% at 16% 32%, rgba(4,6,14,.34), transparent 72%);
  transition: opacity 1.4s var(--ease); }
body.idle .scrim { opacity: .3; }
.ui { position: absolute; inset: 0; transition: opacity 1.2s var(--ease), transform 1.2s var(--ease); }
body.idle .ui.fade { opacity: 0; transform: translateY(26px); pointer-events: none; }
body.athan-on .ui { opacity: 0; }

/* ---------- matches of the day: a quiet card under the prayer card (static paint: costs nothing per frame) ---------- */
.matches { position: absolute; right: 96px; top: 160px; width: 600px; border-radius: 34px; transition: transform .35s var(--spring); }
.matches .mcore { padding: 20px 28px 14px; border-radius: 34px; background: linear-gradient(160deg, rgba(22,26,48,.6), rgba(8,10,22,.5)); box-shadow: inset 0 0 0 1px var(--hair); }
.matches.is-focused { transform: scale(1.025); }
.matches.is-focused .mcore { box-shadow: inset 0 0 0 2px rgba(255,255,255,.92), 0 0 30px rgba(255,255,255,.12); }
.matches.empty, body.no-matches .matches { display: none; }
.mhead { display: flex; justify-content: space-between; align-items: center; height: 28px; margin-bottom: 6px; }
.mhead .mmore { font-size: 15px; color: var(--ink-3); letter-spacing: .04em; }
.mrow { display: grid; grid-template-columns: 70px 1fr 74px 1fr 60px; align-items: center; height: 38px; font-size: 22px; font-variant-numeric: tabular-nums; }
.mrow .t { font-size: 17px; color: var(--ink-2); letter-spacing: .02em; }
.mrow .t.live { color: #ff7a7a; font-weight: 600; }
.mrow .t.live::before { content: ''; display: inline-block; width: 7px; height: 7px; margin: 0 7px 2px 0; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 8px #ff5a5a; vertical-align: middle; }
.mrow .h, .mrow .a { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mrow .h { justify-content: flex-end; }
.mrow b { font-weight: 500; letter-spacing: .03em; }
.mrow img { width: 28px; height: 28px; object-fit: contain; flex: none; }
.mrow .sc { text-align: center; font-weight: 600; color: var(--ink); }
.mrow.pre .sc { color: var(--ink-3); font-weight: 400; }
.mrow .tag { text-align: right; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--ink-3); }
.mrow.mar .tag { font-size: 19px; letter-spacing: 0; }
.mrow.fav b { color: var(--accent); font-weight: 600; }   /* Morocco and Real Madrid */
.mrow.next .sc { color: var(--ink-2); font-weight: 500; font-size: 18px; }

/* full list */
.matches-layer .mscrim { position: absolute; inset: 0; background: rgba(4,6,14,.6); }
.mpanel { position: absolute; left: 150px; right: 150px; top: 56px; bottom: 56px; border-radius: 50px; padding: 44px 60px 30px; display: flex; flex-direction: column;
  background: rgba(13,16,30,.96); box-shadow: inset 0 0 0 1px var(--hair), inset 0 1px 0 rgba(255,255,255,.12); transform: translateY(40px); }
.matches-layer.open .mpanel { transform: none; transition: transform .6s var(--ease); }
.mtop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
.mtitle { font-family: var(--f-display); font-size: 46px; font-weight: 300; letter-spacing: -.03em; }
body.serif .mtitle { font-weight: 400; }
.mdaybtn { display: flex; align-items: center; gap: 18px; height: 60px; padding: 0 26px; border-radius: 999px; font-size: 22px; color: var(--ink); background: rgba(255,255,255,.08); transition: background .25s var(--ease), color .25s, transform .4s var(--spring); }
.mdaybtn i { font-style: normal; font-size: 30px; opacity: .6; }
.mdaybtn.is-focused { background: #fff; color: #0b0f1e; transform: scale(1.04); }
.mlist { flex: 1; overflow: hidden; display: flex; gap: 70px; align-items: flex-start; }
.mcol { flex: 1; min-width: 0; }
.mgroup { margin-bottom: 26px; }
.mgroup h3 { display: flex; align-items: center; gap: 14px; margin: 0 0 6px; font-size: 15px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }
.mgroup h3 span { font-size: 13px; letter-spacing: .12em; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.1); color: var(--ink); }
.mlist .mrow { grid-template-columns: 84px 1fr 84px 1fr; height: 48px; font-size: 23px; border-bottom: 1px solid rgba(255,255,255,.05); }
.mlist .mrow img { width: 32px; height: 32px; }
.mempty { margin: 80px auto; font-size: 24px; color: var(--ink-3); }
.mfoot { margin-top: 14px; font-size: 15px; color: var(--ink-3); }

/* ---------- top bar ---------- */
.topbar { position: absolute; left: 96px; right: 96px; top: 54px; display: flex; justify-content: space-between; align-items: center; }
.greet { display: flex; align-items: center; gap: 16px; font-size: 22px; color: var(--ink); transition: opacity .6s var(--ease); }
.greet .ar { font-size: 21px; color: var(--ink-3); }
.greet .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); transition: background 2s, box-shadow 2s; }
body.no-greeting .greet { opacity: 0; }
.chips { display: flex; gap: 12px; align-items: center; }
.chip { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 22px; border-radius: 999px; font-size: 19px; color: var(--ink); background: rgba(10,14,28,.46); box-shadow: inset 0 0 0 1px var(--hair); transition: transform .45s var(--spring), background .25s var(--ease), color .25s; }
.chip svg { width: 20px; height: 20px; }
.chip.round { width: 54px; padding: 0; justify-content: center; }
.chip.is-focused { background: #fff; color: #0b0f1e; transform: scale(1.08); }
.chip.text { background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--ink-2); padding: 0 6px; }
.chip.text.off { color: #ff9b8a; }

/* ---------- hero clock ---------- */
.hero { position: absolute; left: 96px; top: 160px; }
.clock { font-family: var(--f-display); display: flex; align-items: flex-start; font-size: var(--clock-size); font-weight: var(--clock-weight); letter-spacing: var(--clock-track); line-height: .84; font-variant-numeric: tabular-nums lining-nums; text-shadow: 0 6px 60px rgba(0,0,0,.2); transition: font-size .6s var(--ease); }
.clock .sec, .clock .ap { font-family: var(--f-text); font-size: calc(var(--clock-size) * .155); font-weight: 300; letter-spacing: 0; margin: calc(var(--clock-size) * .09) 0 0 16px; }
.clock .sec { color: var(--ink-3); width: 2.2ch; }
.clock .ap { color: var(--ink-2); }
body.serif .clock .ap, body.serif .clock .sec { font-family: var(--f-display); font-style: italic; }
body.no-seconds .clock .sec { display: none; }
.date { margin-top: 28px; font-size: 30px; font-weight: 300; letter-spacing: -.01em; display: flex; align-items: center; gap: 16px; }
.date i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }
.date span { color: var(--ink-2); }
.verse.out { opacity: 0; translate: 0 10px; }
.verse { transition: opacity .45s var(--ease), translate .45s var(--ease), border-color 2s; margin-top: 34px; max-width: 720px; display: flex; flex-direction: column; gap: 4px; padding-left: 22px; border-left: 2px solid var(--accent); transition: border-color 2s; }
.verse .ar { font-size: 30px; line-height: 1.75; text-align: left; }
.verse .en { font-size: 19px; color: var(--ink-2); font-weight: 300; }
.verse .en b { font-weight: 400; color: var(--ink-3); margin-left: 8px; }
body.no-verse .verse { display: none; }

/* ---------- next prayer ---------- */

/* ---------- day timeline ---------- */
.timeline { position: absolute; left: 96px; right: 96px; top: 664px; height: 96px; transition: opacity .6s var(--ease); }
body.no-timeline .timeline { opacity: 0; }
.timeline .rail { position: absolute; left: 0; right: 0; top: 66px; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28) 5%, rgba(255,255,255,.28) 95%, transparent); }
.timeline .done { position: absolute; left: 0; top: 66px; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.95) 5%); transform-origin: 0 50%; }
.node { position: absolute; top: 0; transform: translateX(-50%); text-align: center; width: 180px; }
.node .t { font-family: var(--f-display); font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.node .n { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.node .d { position: absolute; left: 50%; top: 60px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: rgba(8,10,22,.8); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); transition: background .4s, box-shadow .4s, transform .5s var(--spring); }
.node.past .d { background: #fff; box-shadow: none; }
.node.past .t { color: var(--ink-2); }
.node.next .d { background: var(--accent); box-shadow: 0 0 0 6px rgba(255,255,255,.16), 0 0 24px var(--accent); transform: scale(1.2); }
.node.next .n { color: var(--accent); }
.node.next .t { font-weight: 400; }
.node.sun .t { color: var(--ink-2); font-size: 23px; }
.now { position: absolute; left: 0; top: 60px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.18), 0 0 20px #fff; transition: opacity .4s; }

/* ---------- apps ---------- */
.apps { position: absolute; left: 0; right: 0; top: 800px; }
.apps-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 96px; }
.apps-head .focus-title { font-size: 20px; color: var(--ink-2); transition: opacity .25s; }
.view { overflow: hidden; padding: 20px 0 60px; }
.track { position: relative; display: flex; gap: 26px; padding: 0 96px; width: max-content; transition: transform .42s cubic-bezier(.2,.9,.25,1); will-change: transform; }
/* cards only scale (a compositor-only move); all focus decoration lives in ONE shared ring + glow that glide between cards */
.card { position: relative; z-index: 1; width: 272px; height: 153px; flex: none; border-radius: 28px; will-change: transform; transition: transform .34s var(--spring), translate .32s var(--ease), opacity .3s; }
.card .art { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.07); }
.card .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(170deg, rgba(255,255,255,.16), transparent 40%); pointer-events: none; }
.card .logo { width: 46%; height: 44%; background: var(--fg); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
.card .logo.wide { width: 72%; height: 60%; }
.card .mark { font-family: var(--f-display); font-size: 44px; font-weight: 600; letter-spacing: -.03em; color: var(--fg); }
.card .mark.ar { font-family: var(--f-ar); font-size: 46px; font-weight: 500; letter-spacing: 0; }
.card .glyph { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--fg); font-size: 20px; font-weight: 500; }
.card .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .glyph img { width: 72px; height: 72px; object-fit: contain; }
.card.sys .art { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px var(--hair); }
.card.is-focused { transform: scale(1.1) translateY(-6px); z-index: 2; }
.card.is-pressed { transform: scale(1.03); transition-duration: .12s; }
.card .mv { position: absolute; top: 50%; margin-top: -22px; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #0b0f1e; font-size: 30px; line-height: 40px; text-align: center; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .3s var(--spring); }
.card .mv.l { left: -30px; } .card .mv.r { right: -30px; }
.card.moving { transform: scale(1.12) translateY(-16px); z-index: 3; }
.card.moving .mv { opacity: 1; transform: none; }
body.reorder .card:not(.moving) { opacity: .5; }

/* the shared highlight: fixed size, so moving it is a pure translate; its look is painted once per app color */
.ring, .glow, .edge { position: absolute; left: 0; top: 0; width: 272px; height: 153px; pointer-events: none; opacity: 0; will-change: transform;
  transition: transform .34s var(--spring), opacity .2s var(--ease); }
.ring { z-index: 4; border-radius: 28px; }
.ring::before { content: ''; position: absolute; inset: -6px; border-radius: 34px; box-shadow: 0 0 0 2px var(--glow-hi), 0 0 24px var(--glow-mid); }
/* a light sweeps around the border twice on arrival: a rotating conic layer UNDER the card, so only its rim shows.
   Rotation and fade run on the GPU compositor (no repaint per frame). */
.edge { z-index: 0; transition: transform .34s var(--spring); }
.edge b { position: absolute; inset: -4px; border-radius: 32px; overflow: hidden; }
.edge i { position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; margin: -165px 0 0 -165px; will-change: transform;
  background: conic-gradient(transparent 0deg, var(--glow) 50deg, #fff 90deg, var(--glow) 130deg, transparent 180deg, var(--glow) 230deg, #fff 270deg, var(--glow) 310deg, transparent 360deg); }
.glow { z-index: 0; }
.glow::before { content: ''; position: absolute; inset: 20px -10px -50px; border-radius: 50%; background: radial-gradient(closest-side, var(--glow-mid), transparent); }
.ring.on, .glow.on { opacity: 1; }
.glow.on { opacity: .75; }

/* ---------- settings ---------- */
.settings-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,6,14,.15), rgba(4,6,14,.7) 40%); }
.settings-panel { position: absolute; right: 36px; top: 36px; bottom: 36px; width: 1180px; padding: 7px; border-radius: 50px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px var(--hair); transform: translateX(80px); display: flex; }
.settings-panel::before { content: ''; position: absolute; inset: 7px; border-radius: 43px; background: rgba(13,16,30,.95); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
.settings-panel > * { position: relative; }
.settings-layer.open .settings-panel { transform: none; transition: transform .7s var(--ease); }
.set-nav { width: 360px; padding: 50px 26px 40px 34px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid rgba(255,255,255,.07); }
.settings-title { font-family: var(--f-display); font-size: 46px; font-weight: 300; letter-spacing: -.03em; margin: 0 0 26px 16px; }
body.serif .settings-title { font-weight: 400; }
.set-tab { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 22px; font-size: 21px; color: var(--ink-2); transition: background .25s var(--ease), color .25s, transform .45s var(--spring); }
.set-tab svg { width: 22px; height: 22px; }
.set-tab.on { background: rgba(255,255,255,.08); color: var(--ink); }
.set-tab.is-focused { background: #fff; color: #0b0f1e; transform: scale(1.03); }
.settings-sub { margin: auto 0 0 16px; font-size: 15px; color: var(--ink-3); line-height: 1.5; }
.set-body { flex: 1; padding: 54px 40px 40px; display: flex; flex-direction: column; }
.set-head { font-size: 15px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 22px 26px; }
.settings-rows { display: flex; flex-direction: column; gap: 6px; }
.settings-rows.swap { animation: swap .5s var(--ease); }
@keyframes swap { from { opacity: 0; translate: 16px 0; } }
.set-row { display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; border-radius: 24px; transition: background .25s var(--ease), color .25s, transform .45s var(--spring); }
.set-label { font-size: 21px; color: var(--ink-2); }
.set-value { display: flex; align-items: center; gap: 12px; font-size: 21px; }
.set-arrow { font-style: normal; font-size: 28px; opacity: 0; transition: opacity .2s; }
.set-row.act .set-text { color: var(--ink-3); font-size: 18px; }
.set-row.is-focused { background: #fff; color: #0b0f1e; transform: scale(1.015); }
.set-row.is-focused .set-label, .set-row.is-focused.act .set-text { color: rgba(11,15,30,.55); }
.set-row.is-focused .set-arrow { opacity: .5; }

/* ---------- athan over the live sky ---------- */
.athan-bg { position: absolute; inset: 0; background: radial-gradient(70% 70% at 50% 50%, rgba(8,10,24,.4), rgba(4,6,14,.88)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.athan-rings i { box-shadow: inset 0 0 0 1.5px var(--accent); opacity: .6; }
.athan-inner { color: #fff; }
.athan-kicker { font-family: var(--f-ar); font-size: 30px; color: var(--ink-2); }
.athan-name-ar { font-family: var(--f-ar); font-size: 170px; font-weight: 500; line-height: 1.4; }
.athan-name { font-family: var(--f-display); font-size: 44px; font-weight: 300; letter-spacing: -.02em; }
.athan-meta { font-size: 22px; color: var(--ink-2); margin-top: 14px; font-variant-numeric: tabular-nums; }
.athan-progress { color: var(--accent); }
.athan-hint { position: absolute; bottom: 72px; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-3); }
.athan-inner > * { opacity: 0; transform: translateY(24px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
.athan-layer.open .athan-inner > * { opacity: 1; transform: none; }
.athan-layer.open .athan-inner > :nth-child(2) { transition-delay: .12s; }
.athan-layer.open .athan-inner > :nth-child(3) { transition-delay: .24s; }
.athan-layer.open .athan-inner > :nth-child(4) { transition-delay: .36s; }
.athan-layer.open .athan-inner > :nth-child(5) { transition-delay: .48s; }

.toast { background: rgba(255,255,255,.96); color: #0b0f1e; font-weight: 500; }

.topbar, .hero, .matches, .timeline, .apps { animation: enter .55s var(--ease) both; }
@keyframes enter { from { opacity: 0; translate: 0 24px; } }
</style>
</head>
<body>
<div id="stage">
  <div class="wall" id="wall"><canvas id="sky"></canvas><div class="photos" id="photos"></div></div>
  <div class="dim"></div>
  <div class="scrim"></div>

  <div class="ui fade">
    <header class="topbar">
      <div class="greet"><span class="dot"></span><span id="greet"></span><span class="ar" id="greetAr"></span></div>
      <div class="chips">
        <span class="chip text" id="hijri"></span>
        <span class="chip text" id="net"></span>
        <button class="chip" data-focus id="loc"></button>
        <button class="chip round" data-focus id="gear" aria-label="Settings"></button>
      </div>
    </header>
    <aside class="matches empty" id="matches" data-focus><div class="mcore" id="mcore"></div></aside>
  </div>

  <div class="ui">
    <section class="hero">
      <div class="clock"><span id="hm">--:--</span><span class="ap" id="ap"></span><span class="sec" id="sec"></span></div>
      <div class="date" id="date"></div>
      <div class="ui fade" style="position:static"><div class="verse" id="verse"></div></div>
    </section>
  </div>

  <div class="ui fade">

    <section class="timeline">
      <div class="rail"></div><div class="done" id="done"></div>
      <div id="nodes"></div><div class="now" id="now"></div>
    </section>

    <section class="apps">
      <div class="apps-head"><span class="eyebrow">Apps</span><span class="focus-title" id="ftitle"></span></div>
      <div class="view"><div class="track" data-track="96" data-group id="track"></div></div>
    </section>
  </div>
</div>

<script src="../shared/prayer.js"></script>
<script src="../shared/launcher.js"></script>
<script src="../shared/look.js"></script>
<script src="../shared/remote.js"></script>
<script src="../shared/athan.js" data-audio="../assets/athan.mp3"></script>
<script src="../shared/matches.js"></script>
<script src="../shared/settings.js"></script>
<script src="../shared/sky.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  TV.look.apply();
  // boot timing, read with adb logcat -s Horizon
  requestAnimationFrame(() => requestAnimationFrame(() => console.log('HZBOOT first frame ' + Math.round(performance.now()) + 'ms')));

  let apps = [];
  const face = a => a.native ? (a.banner ? `<img class="shot" src="/icon/${encodeURIComponent(a.id)}?banner=1" alt="">`
      : `<span class="glyph"><img src="/icon/${encodeURIComponent(a.id)}" alt=""><span>${a.name}</span></span>`)
    : a.logo ? `<span class="logo${a.wide ? ' wide' : ''}" style="--logo:url('${TV.LOGO_CDN}${a.logo}.svg')"></span>`
    : a.mark ? `<span class="mark${a.ar ? ' ar' : ''}">${a.mark}</span>`
    : `<span class="glyph">${TV.icon(a.icon, 44, 1.5)}<span>${a.name}</span></span>`;
  // banner color for apps without a TV banner: the app's own color, deepened
  const deepen = (hex, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) * k).toString(16).padStart(2, '0')).join('');
  // your order first (saved), then any app you have not placed yet; Settings stays last
  function ordered() {
    const order = TV.settings.appOrder || [];
    const rank = id => { const i = order.indexOf(id); return i < 0 ? 1e6 : i; };
    return TV.APPS.map((a, i) => [a, i]).sort((x, y) => (rank(x[0].id) - rank(y[0].id)) || (x[1] - y[1])).map(x => x[0]);
  }
  function renderApps() {
    apps = [...ordered(), { id: 'settings', name: 'Settings', icon: 'cog', sys: true, fg: '#fff', glow: '#ffffff' }];
    $('track').innerHTML = apps.map((a, i) => {
      const glow = a.glow || '#ffffff';
      const bg = a.bg || (a.native ? `linear-gradient(145deg, ${deepen(a.color, .75)}, ${deepen(a.color, .3)})` : 'none');
      return `<button class="card${a.sys ? ' sys' : ''}" data-focus ${a.sys ? '' : 'data-hold'} ${i === 0 ? 'data-autofocus' : ''} data-app="${a.id}"
        style="--bg:${bg};--fg:${a.fg || '#fff'};--glow:${glow};--glow-hi:${glow}dd;--glow-mid:${glow}99;--glow-soft:${glow}59">
        <span class="art">${face(a)}</span>
        <span class="mv l">‹</span><span class="mv r">›</span>
      </button>`;
    }).join('');
    $('track').insertAdjacentHTML('beforeend', '<div class="glow" id="glow"></div><div class="edge" id="edge"><b><i></i></b></div><div class="ring" id="ring"></div>');
    $('track').dataset.x = 0; $('track').style.transform = '';
  }
  renderApps();
  document.addEventListener('tv:apps', () => { const had = TV.remote.current && TV.remote.current.closest('.card'); renderApps(); if (had) TV.remote.focusFirst(); });
  const appOf = c => apps.find(a => a.id === c.dataset.app);
  const cards = () => [...$('track').querySelectorAll('.card')];
  $('track').addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c || moving) return;
    const app = appOf(c);
    app.sys ? TV.openSettings() : TV.openApp(app);
  });
  $('gear').innerHTML = TV.icon('cog', 22);
  $('gear').addEventListener('click', () => TV.openSettings());
  $('loc').addEventListener('click', () => TV.openSettings('prayer'));

  /* ---------- move mode: hold OK on an app, ◀ ▶ to move, ▲ to send it first, OK or Back to drop ---------- */
  let moving = null;
  function title(c) {
    if (!c) return '';
    if (moving) return `Moving ${appOf(c).name}  ·  ◀ ▶ move  ·  ▲ first  ·  OK done`;
    return appOf(c).name + (appOf(c).sys ? '' : '  ·  OK to open  ·  hold OK to move');
  }
  $('track').addEventListener('hold', e => {
    const c = e.target.closest('.card'); if (!c || c.classList.contains('sys')) return;
    moving = c; c.classList.add('moving'); document.body.classList.add('reorder'); place(c, true);
    $('ftitle').textContent = title(c);
  }, true);
  function drop() {
    moving.classList.remove('moving'); document.body.classList.remove('reorder'); sweep(null);
    TV.settings.appOrder = cards().filter(c => !c.classList.contains('sys')).map(c => c.dataset.app);
    TV.saveSettings();
    const c = moving; moving = null;
    $('ftitle').textContent = title(c);
  }
  // FLIP: snapshot positions, reorder the DOM, then glide every card from its old spot
  function shift(to) {
    const list = cards(), from = list.indexOf(moving), last = list.length - 2; // settings stays last
    to = Math.max(0, Math.min(last, to));
    if (to === from) return;
    const before = new Map(list.map(c => [c, c.offsetLeft]));
    $('track').insertBefore(moving, list[to > from ? to + 1 : to]);
    for (const c of cards()) {
      const dx = before.get(c) - c.offsetLeft; if (!dx) continue;
      c.style.transition = 'none'; c.style.translate = `${dx}px 0`;
      requestAnimationFrame(() => { c.style.transition = ''; c.style.translate = ''; });
    }
    TV.remote.slide(moving); place(moving);
  }
  TV.remote.intercept = e => {
    if (!moving) return false;
    if (e.repeat && (e.key === 'Enter' || e.key === ' ')) return true; // still holding OK from the long-press
    const i = cards().indexOf(moving);
    if (e.key === 'ArrowLeft') shift(i - 1);
    else if (e.key === 'ArrowRight') shift(i + 1);
    else if (e.key === 'ArrowUp') shift(0);
    else if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape' || e.key === 'Backspace') drop();
    return true;
  };

  // glide the shared ring + glow + edge onto a card (same scale/lift as the focused card)
  let lastColor = '';
  function place(c, hold) {
    const hl = [$('ring'), $('glow'), $('edge')];
    if (!c) { hl.forEach(el => el.classList.remove('on')); sweep(null); return; }
    const lift = c.classList.contains('moving') ? 'translateY(-16px) scale(1.12)' : 'translateY(-6px) scale(1.1)';
    const tf = `translate3d(${c.offsetLeft}px, ${c.offsetTop}px, 0) ${lift}`;
    const color = c.style.getPropertyValue('--glow');
    for (const el of hl) {
      if (color !== lastColor) for (const v of ['--glow', '--glow-hi', '--glow-mid']) el.style.setProperty(v, c.style.getPropertyValue(v));
      el.style.transform = tf;
      if (el !== hl[2]) el.classList.add('on');
    }
    lastColor = color;
    const kind = c.classList.contains('sys') ? null : hold || c.classList.contains('moving') ? 'hold' : 'arrive';
    if (!(kind === 'hold' && edgeKind === 'hold')) sweep(kind); // keep spinning while an app is being moved
  }
  // the edge light: Web Animations on transform/opacity only, so it never blocks the page
  let edgeAnims = [], edgeKind = null;
  function sweep(kind) {
    edgeAnims.forEach(a => a.cancel()); edgeAnims = []; edgeKind = kind;
    if (!kind) return;
    const e = $('edge'), spin = e.querySelector('i'), hold = kind === 'hold';
    edgeAnims = [
      spin.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: hold ? 1100 : 1200, iterations: hold ? Infinity : 2 }),
      e.animate(hold ? [{ opacity: 1 }, { opacity: 1 }] : [{ opacity: 1 }, { opacity: 1, offset: .75 }, { opacity: 0 }], { duration: hold ? 1000 : 2400, iterations: hold ? Infinity : 1 }),
    ];
  }

  // focused app title + gentle wallpaper parallax following the selection
  document.addEventListener('tv:focus', e => {
    const c = e.detail.closest('.card');
    place(c);
    $('ftitle').textContent = title(c);
    const k = c ? (cards().indexOf(c) / (apps.length - 1) - .5) : 0;
    if (TV.settings.parallax) $('wall').style.setProperty('--px', `${-k * 34}px`); // on the wallpaper only: no page-wide style recalc
  });

  // verse: rotates through the day (Settings > Home screen > Verse changes)
  let verseIdx = -1;
  function paintVerse() {
    const { i, v } = TV.verseNow();
    if (i === verseIdx) return;
    const el = $('verse'), first = verseIdx < 0;
    verseIdx = i;
    const set = () => { el.innerHTML = `<div class="ar">${v.ar}</div><div class="en">${v.en}<b>${v.ref}</b></div>`; el.classList.remove('out'); };
    if (first) return set();
    el.classList.add('out'); setTimeout(set, 450);
  }
  paintVerse();
  setInterval(paintVerse, 15000);

  // P: 5-second smoothness probe — sweeps the app row and logs frame rate (read with adb logcat -s Horizon)
  document.addEventListener('keydown', e => {
    if (e.key === 'o' || e.key === 'O') { const m = TV.sky.mode === 'still' ? 'live' : 'still'; TV.sky.setMode(m); console.log('HZMODE ' + m); return; }
    if (e.key !== 'p' && e.key !== 'P') return;
    const gaps = []; let last = performance.now(), run = true, n = 0;
    (function f(t) { gaps.push(t - last); last = t; if (run) requestAnimationFrame(f); })(last);
    const step = setInterval(() => TV.remote.move(n++ % 16 < 8 ? 'right' : 'left'), 220);
    setTimeout(() => {
      run = false; clearInterval(step);
      const g = gaps.slice(2).sort((a, b) => a - b), avg = g.reduce((a, b) => a + b, 0) / g.length;
      const p95 = g[Math.floor(g.length * .95)], janky = g.filter(x => x > 34).length;
      console.log(`HZPERF fps=${(1000 / avg).toFixed(1)} p95=${p95.toFixed(1)}ms janky=${janky}/${g.length}`);
    }, 5000);
  });

  const net = () => { $('net').innerHTML = TV.icon('wifi', 22); $('net').classList.toggle('off', !navigator.onLine); };
  addEventListener('online', net); addEventListener('offline', net); net();

  // timeline spans Fajr − 50 min → Isha + 50 min
  let span = [0, 1];
  const RAIL = 1728;
  const pos = t => Math.min(1, Math.max(0, (t - span[0]) / (span[1] - span[0])));

  function onTimes(s) {
    const L = s.list;
    span = [L[0].time.getTime() - 50 * 60000, L[5].time.getTime() + 50 * 60000];
    $('nodes').innerHTML = L.map(p => `
      <div class="node${p.salah ? '' : ' sun'}" data-k="${p.key}" style="left:${pos(p.time) * RAIL}px">
        <div class="t">${TV.fmt.time(p.time)}</div><div class="n">${p.name}</div><span class="d"></span>
      </div>`).join('');
    $('loc').innerHTML = `${TV.icon('globe', 20)}<span>${s.location.city || 'Location'}</span>`;
    $('hijri').textContent = TV.fmt.hijri(s.now);
  }

  // write to the page only when a value really changed: an unchanged screen costs nothing
  const put = (id, v, html) => { const el = $(id); if (!el || el._v === v) return; el._v = v; if (html) el.innerHTML = v; else el.textContent = v; };
  const setStyle = (id, prop, v) => { const el = $(id); if (!el || el['_' + prop] === v) return; el['_' + prop] = v; el.style[prop] = v; };
  function onTick(s) {
    const n = s.now, g = TV.greeting(n);
    put('greet', g.en); put('greetAr', g.ar);
    put('hm', TV.fmt.time(n));
    put('ap', TV.fmt.ampm(n));
    put('sec', String(n.getSeconds()).padStart(2, '0'));
    put('date', `${TV.fmt.weekday(n)}<i></i><span>${TV.fmt.dayMonth(n)}</span>`, true);
    const k = s.showingTomorrow ? 0 : Math.round(pos(n.getTime()) * 2000) / 2000;
    setStyle('done', 'transform', `scaleX(${k})`);
    setStyle('now', 'transform', `translateX(${(k * RAIL).toFixed(1)}px)`);
    setStyle('now', 'opacity', s.showingTomorrow ? '0' : '1');
    document.querySelectorAll('.node').forEach(el => {
      const p = s.list.find(q => q.key === el.dataset.k);
      el.classList.toggle('next', !!p.isNext); el.classList.toggle('past', p.past && !p.isNext);
    });
  }

  /* ---------- matches of the day ---------- */
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function mrow(m, wide) {
    const c = TV.matches.comp(m.comp) || { tag: '' };
    const t = m.next ? `<span class="t">${new Date(m.start).toLocaleDateString('en-GB', { weekday: 'short' })}</span>`
      : m.state === 'live' ? `<span class="t live">${esc(m.min)}</span>` : m.state === 'post' ? '<span class="t">FT</span>'
      : m.state === 'off' ? '<span class="t">PPD</span>' : `<span class="t">${TV.fmt.time(new Date(m.start))}</span>`;
    const sc = m.next ? TV.fmt.time(new Date(m.start)) : m.state === 'pre' || m.state === 'off' ? '–' : `${esc(m.h.s)}–${esc(m.a.s)}`;
    const img = x => x.logo ? `<img src="${esc(x.logo)}" alt="">` : '';
    return `<div class="mrow ${m.state}${m.comp === 'mar' ? ' mar' : ''}${m.fav ? ' fav' : ''}${m.next ? ' next' : ''}">${t}<span class="h"><b>${esc(m.h.code)}</b>${img(m.h)}</span><span class="sc">${sc}</span><span class="a">${img(m.a)}<b>${esc(m.a.code)}</b></span>${wide ? '' : `<span class="tag">${c.tag}</span>`}</div>`;
  }
  let mHtml = '';
  function paintMatches(feed) {
    const all = feed ? feed.card || feed.list || [] : [], list = all.slice(0, 10);
    const more = all.length > 10 ? `+${all.length - 10} more` : '';
    const html = list.length ? `<div class="mhead"><span class="eyebrow">${feed.off ? 'Matches · ' + TV.matches.label(feed.off) : 'Matches today'}</span><span class="mmore">${more}</span></div>${list.map(m => mrow(m)).join('')}` : '';
    if (html === mHtml) return;       // nothing changed: no repaint
    mHtml = html;
    $('mcore').innerHTML = html;
    $('matches').classList.toggle('empty', !list.length);
    if (mLayer && mLayer.classList.contains('open')) renderPanel();
  }

  // full list: built when opened, emptied when closed (holds no memory while hidden)
  let mLayer = null, mOff = 0, mReturn = null;
  function buildPanel() {
    mLayer = document.createElement('div');
    mLayer.className = 'matches-layer layer';
    mLayer.innerHTML = `<div class="mscrim"></div><div class="mpanel">
      <div class="mtop"><div class="mtitle">Matches</div><button class="mdaybtn" data-focus data-cycle><i>‹</i><span id="mday"></span><i>›</i></button></div>
      <div class="mlist" id="mlist"></div>
      <div class="mfoot">◀ ▶ change day · ▲ ▼ scroll · Back to close</div></div>`;
    $('stage').appendChild(mLayer);
    const btn = mLayer.querySelector('.mdaybtn');
    btn.addEventListener('cycle', e => { const n = Math.max(-1, Math.min(6, mOff + e.detail)); if (n !== mOff) { mOff = n; renderPanel(); } });
    mLayer.querySelector('.mscrim').addEventListener('click', closePanel);
    mLayer.addEventListener('close', closePanel);
    document.addEventListener('keydown', e => {
      if (!mLayer.classList.contains('open') || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault(); e.stopImmediatePropagation();
      $('mlist').scrollTop += e.key === 'ArrowDown' ? 300 : -300;
    }, true);
  }
  async function renderPanel() {
    const off = mOff;
    $('mday').textContent = TV.matches.label(off);
    const list = await TV.matches.load(off);
    if (off !== mOff || !mLayer.classList.contains('open')) return;
    const groups = TV.matches.COMPS.map(c => [c, list.filter(m => m.comp === c.id).sort((a, b) => a.start - b.start)]).filter(g => g[1].length);
    if (!groups.length) { $('mlist').innerHTML = `<div class="mempty">No matches ${off === 0 ? 'today' : 'on this day'} in your competitions.</div>`; return; }
    // two balanced columns
    const cols = [[], []], h = [0, 0];
    for (const g of groups) { const i = h[0] <= h[1] ? 0 : 1; cols[i].push(g); h[i] += g[1].length + 1.5; }
    $('mlist').innerHTML = cols.map(col => `<div class="mcol">${col.map(([c, ms]) =>
      `<div class="mgroup"><h3><span>${c.tag}</span>${c.name}</h3>${ms.map(m => mrow(m, true)).join('')}</div>`).join('')}</div>`).join('');
    $('mlist').scrollTop = 0;
  }
  function openPanel() {
    if (!mLayer) buildPanel();
    const feed = TV.matches.feed;
    mOff = feed ? feed.off : 0;
    mReturn = TV.remote.current;
    mLayer.classList.add('open');
    TV.remote.focus(mLayer.querySelector('.mdaybtn'));
    $('mlist').innerHTML = '';
    renderPanel();
  }
  function closePanel() {
    if (!mLayer || !mLayer.classList.contains('open')) return;
    mLayer.classList.remove('open');
    setTimeout(() => { if (!mLayer.classList.contains('open')) $('mlist').innerHTML = ''; }, 400);
    TV.remote.reset(); TV.remote.focus(mReturn);
  }
  $('matches').addEventListener('click', openPanel);
  document.addEventListener('tv:matches', e => paintMatches(e.detail));
  paintMatches(TV.matches.feed); // last known matches right away, then fresh data
  TV.matches.start();

  TV.start({ onTimes, onTick });
  TV.sky.start($('sky'), { scene: 'dunes', photoHost: $('photos') });
  TV.remote.focusFirst();
})();
</script>
</body>
</html>
